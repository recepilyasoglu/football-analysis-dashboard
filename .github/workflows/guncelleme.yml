name: Haftalik Veri Guncelleme

on:
  schedule:
    # Her Pazartesi sabah 06:00 UTC (Türkiye saati ile 09:00)
    - cron: '0 6 * * 1'
  workflow_dispatch: # İstenilen zaman manuel çalıştırma butonu

permissions:
  contents: write # Asistana CSV dosyasını güncelleme yetkisi

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Kur
        run: |
          pip install -r requirements.txt

      - name: Veri Çekme Scriptini (soccerdata) Çalıştır
        run: |
          python otomatik_veri_cek.py

      - name: Yeni Verileri Repoya Kaydet (Commit)
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add otomatik_understat_verileri.csv
          git commit -m "Otomatik veri güncelleme: Haftalık xG ve Şut verileri" || echo "Değişen veri yok"
          git push
